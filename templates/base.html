<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Design.pro - Дизайн интерьеров</title>
    <!-- Подключаем Bootstrap для красивого внешнего вида -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Навигационная панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Design.pro</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <!-- Если пользователь вошел -->
                <a class="nav-link" href="{% url 'cabinet' %}">Личный кабинет</a>
                <a class="nav-link" href="{% url 'logout' %}">Выход</a>
            {% else %}
                <!-- Если пользователь гость -->
                <a class="nav-link" href="{% url 'login' %}">Вход</a>
                <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- Основной контент страницы -->
<div class="container">
    <!-- Блок для вывода сообщений (успех, ошибка) -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Сюда будет вставляться контент из других шаблонов -->
    {% block content %}
    {% endblock %}
</div>

<!-- Скрипты Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
