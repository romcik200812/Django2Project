{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">Подтверждение удаления</div>
            <div class="card-body">
                <h5 class="card-title">Вы уверены?</h5>
                <p>Вы собираетесь удалить заявку: <strong>{{ req.title }}</strong></p>
                <p class="text-muted small">Это действие нельзя отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'cabinet' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
